name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC sign-in to Azure (no stored Azure password)

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production   # add required reviewers in GitHub to gate releases
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      LOCATION: ${{ vars.AZURE_LOCATION || 'uaenorth' }}
      PREFIX: ${{ vars.NAME_PREFIX || 'd365portal' }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resource group
        run: az group create --name "$RG" --location "$LOCATION" --output none

      - name: Platform resources (registry, vault, database, environment)
        id: platform
        run: |
          out=$(az deployment group create \
            --resource-group "$RG" --name "platform-$TAG" \
            --template-file infra/main.bicep \
            --parameters namePrefix="$PREFIX" location="$LOCATION" deployApps=false \
                         postgresAdminPassword="$PG_PASSWORD" \
                         apiClientId="${{ vars.API_CLIENT_ID }}" webClientId="${{ vars.WEB_CLIENT_ID }}" \
            --query properties.outputs -o json)
          echo "acr=$(echo "$out" | jq -r .acrName.value)" >> "$GITHUB_OUTPUT"
        env:
          PG_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}

      - name: Build images in Azure Container Registry
        run: |
          az acr build --registry "${{ steps.platform.outputs.acr }}" --image "d365portal-api:$TAG" ./backend
          az acr build --registry "${{ steps.platform.outputs.acr }}" --image "d365portal-web:$TAG" ./frontend

      - name: Deploy apps
        id: apps
        run: |
          url=$(az deployment group create \
            --resource-group "$RG" --name "apps-$TAG" \
            --template-file infra/main.bicep \
            --parameters namePrefix="$PREFIX" location="$LOCATION" deployApps=true imageTag="$TAG" \
                         postgresAdminPassword="$PG_PASSWORD" \
                         apiClientId="${{ vars.API_CLIENT_ID }}" webClientId="${{ vars.WEB_CLIENT_ID }}" \
                         superAdminTenantId="${{ vars.SUPERADMIN_ENTRA_TENANT_ID }}" \
                         superAdminObjectId="${{ vars.SUPERADMIN_OBJECT_ID }}" \
                         seedEnabled="${{ vars.SEED_ENABLED || 'false' }}" \
                         seedAdminEmail="${{ vars.SEED_ADMIN_EMAIL }}" \
                         seedEntraTenantIds="${{ vars.SEED_ENTRA_TENANT_IDS }}" \
                         seedCompanies="${{ vars.SEED_COMPANIES || 'USMF' }}" \
            --query properties.outputs.webUrl.value -o tsv)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Portal URL: $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          PG_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.apps.outputs.url }}/")
            [ "$code" = "200" ] && echo "Web is up" && exit 0
            sleep 10
          done
          echo "Web did not return 200"; exit 1
