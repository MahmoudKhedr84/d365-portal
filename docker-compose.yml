# Local development stack: PostgreSQL + API + web (nginx serving the SPA and proxying /api).
#   cp .env.example .env   # fill in the Entra ids
#   docker compose up --build
#   open http://localhost:8080
name: d365-portal

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: d365portal
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d d365portal"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Host=db;Port=5432;Database=d365portal;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Database__Provider: Postgres
      Database__MigrateOnStartup: "true"
      AzureAd__TenantId: organizations
      AzureAd__ClientId: ${API_CLIENT_ID:?set API_CLIENT_ID in .env}
      Platform__SuperAdmins__0__TenantId: ${SUPERADMIN_ENTRA_TENANT_ID:-}
      Platform__SuperAdmins__0__ObjectId: ${SUPERADMIN_OBJECT_ID:-}
      # The SPA calls the API through nginx on the same origin; CORS only matters for `npm run dev`.
      Cors__AllowedOrigins__0: http://localhost:5173
      Hosting__RequireHttps: "false"
      Swagger__Enabled: "true"
      Seed__Enabled: ${SEED_ENABLED:-false}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-}
      Seed__Companies: ${SEED_COMPANIES:-USMF}
      Seed__EntraTenantIds: ${SEED_ENTRA_TENANT_IDS:-}
      # Trust X-Forwarded-* only from the nginx container on the Docker network.
      ForwardedHeaders__KnownNetworks__0: 172.16.0.0/12
    ports:
      - "5080:8080"

  web:
    build: ./frontend
    depends_on:
      - api
    environment:
      API_UPSTREAM: http://api:8080
      ENTRA_CLIENT_ID: ${WEB_CLIENT_ID:?set WEB_CLIENT_ID in .env}
      ENTRA_AUTHORITY: https://login.microsoftonline.com/organizations
      API_SCOPE: api://${API_CLIENT_ID}/access_as_user
      API_BASE_URL: /api
    ports:
      - "8080:8080"

volumes:
  pgdata:
